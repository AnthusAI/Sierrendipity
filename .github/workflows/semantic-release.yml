name: Semantic Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.actor.login != 'github-actions[bot]'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Ensure release branch checkout
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
      - run: npm ci --ignore-scripts
      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(git tag | sort)"
          npx semantic-release
          new_tag="$(comm -13 <(printf '%s\n' "$before") <(git tag | sort) | sed '/^$/d' | tail -n1)"
          if [ -n "$new_tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${new_tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  guard-pre-1-0:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block accidental 1.x release
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "Computed release version: ${RELEASE_VERSION}"
          case "${RELEASE_VERSION}" in
            0.*) ;;
            *)
              echo "Refusing: expected a pre-1.0.0 version, got ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac
