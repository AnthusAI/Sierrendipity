name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No AWS credentials are configured: the infra specs synthesize offline from the committed
      # infra/cdk.context.json.
      # The hosted runner is not root, so the runner's per-run uid sandbox cannot work here. The
      # sandbox is covered with full privileges by the runner-linux job (Docker); here it is off.
      - run: npm test
        env:
          RUNNER_SANDBOX: "off"

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  runner-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The GitHub Actions layer cache keeps the toolchain layers (apt, the pinned Rust stage) between runs.
      - name: Build the runner image (default target is test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          load: true
          tags: sierrendipity-runner-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the Linux-only specs inside the image
        run: docker run --rm sierrendipity-runner-test npm run test:linux

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc -p api --noEmit
      - run: npx tsc -p infra --noEmit
      - run: npx tsc -p runner --noEmit
      - run: npx tsc -p explorer --noEmit
      - run: npm run typecheck -w web

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [specs, runner-linux, typecheck]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: sierrendipity-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build -w web

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::335163751677:role/SierrendipityGitHubProductionDeploy
          aws-region: us-east-1

      - name: Resolve the production site targets
        id: site
        run: |
          site_bucket="$(aws cloudformation describe-stacks --stack-name Sierrendipity --query \"Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue\" --output text)"
          distribution_id="$(aws cloudformation describe-stacks --stack-name Sierrendipity --query \"Stacks[0].Outputs[?OutputKey=='SiteDistributionId'].OutputValue\" --output text)"
          test -n "$site_bucket" && test "$site_bucket" != "None"
          test -n "$distribution_id" && test "$distribution_id" != "None"
          echo "bucket=$site_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution_id" >> "$GITHUB_OUTPUT"

      - name: Publish the exact validated web build
        run: |
          aws s3 sync web/dist "s3://${{ steps.site.outputs.bucket }}" --delete --exclude config.json --exclude 'deployments/*'
          printf '{"source":"github-actions","sha":"%s","branch":"%s","workflow":"%s/%s/actions/runs/%s"}\n' \
            "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            | aws s3 cp - "s3://${{ steps.site.outputs.bucket }}/deployments/${{ github.sha }}.json" --content-type application/json
          aws s3 cp "s3://${{ steps.site.outputs.bucket }}/deployments/${{ github.sha }}.json" "s3://${{ steps.site.outputs.bucket }}/deployments/latest.json" --content-type application/json
          aws cloudfront create-invalidation --distribution-id "${{ steps.site.outputs.distribution }}" --paths '/*'

      - name: Verify the live production stack
        run: |
          aws cloudformation describe-stacks --stack-name Sierrendipity --query 'Stacks[0].{Status:StackStatus,Updated:LastUpdatedTime,Outputs:Outputs}' --output json
          curl --fail --show-error --retry 5 https://sierrendipity.anth.us/config.json
