name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No AWS credentials are configured: the infra specs synthesize offline from the committed
      # infra/cdk.context.json.
      # The hosted runner is not root, so the runner's per-run uid sandbox cannot work here. The
      # sandbox is covered with full privileges by the runner-linux job (Docker); here it is off.
      - run: npm test
        env:
          RUNNER_SANDBOX: "off"

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  runner-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The GitHub Actions layer cache keeps the toolchain layers (apt, the pinned Rust stage) between runs.
      - name: Build the runner image (default target is test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          load: true
          tags: sierrendipity-runner-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the Linux-only specs inside the image
        run: docker run --rm sierrendipity-runner-test npm run test:linux

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc -p api --noEmit
      - run: npx tsc -p infra --noEmit
      - run: npx tsc -p runner --noEmit
      - run: npx tsc -p explorer --noEmit
      - run: npm run typecheck -w web
