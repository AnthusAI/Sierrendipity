# The concept registry. Lessons introduce and require concepts by id; the checker rejects unknown ids.
concepts:
  - { id: cards, title: A card tells the machine what to do }
  - { id: numbers-on-cards, title: A card carries a number you can change }
  - { id: last-wins, title: The last card to run wins }
  - { id: two-boxes, title: Each box holds its own number }
  - { id: add, title: The machine can add }
  - { id: multiply, title: The machine can multiply, and one box can be used twice }
  - { id: card-flip, title: A card is one big number you can flip to see as lamps }
  - { id: binary-lamps, title: Lamps are switches worth 1, 2, 4, 8 and so on }
  - { id: fields, title: The lamps of a card are split into bands with jobs }
