id: c1/02-change-the-number
title: Change the Number
minutes: 3
concepts:
  introduces: [numbers-on-cards]
  requires: [cards]
# One new idea (a card carries a number you can change), one action (spin the number), one card.
boxes: [a0]
pointer: false
hideEnd: true
starter:
  hex: ["0x00500513"]   # put 5 in box a0
tabs: [cards]
scenes:
  - id: look
    say: This is the same card, with a number you can change. Press Continue when you are ready.
    show: [cards, boxes]
    spotlight: "card:0"

  - id: spin
    say: Spin the number until the box shows 9, then press Step.
    show: [cards, boxes]
    spotlight: "card:0"
    until:
      - the student edited a card
      - the machine has taken at least 1 step
      - the box shows 9
    hints:
      - Which number on the card ends up in the box?
      - The box shows whatever number the card has, so change the card first.
      - Spin the card's number up to 9, then press Step.
    showMe: demo-spin
    doneSay: You changed the card, and the box followed.
    lock: [drag, toggle]

  - id: another
    say: You changed what the machine does by changing one number. Try a different number if you like.
    show: [cards, boxes]
    skippable: true
nowYouCan:
  - Change the number on a card.
  - Make the box show the number you want.
warmups:
  - id: change-the-six
    concept: numbers-on-cards
    question: The card says Put 6 into the box. What does the box hold after one Step?
    program:
      asm: |
        addi a0, zero, 6
    target: a0
    expected: 6
