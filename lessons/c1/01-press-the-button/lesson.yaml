id: c1/01-press-the-button
title: Press the Button
minutes: 3
concepts:
  introduces: [cards]
  requires: []
# One new idea (a card tells the machine what to do), one action (press Step), one card.
# The machine starts small: one box, no pointing arrow, no hex. Cannot be failed.
boxes: [a0]
pointer: false
hideEnd: true
starter:
  hex: ["0x00500513"]   # put 5 in box a0
tabs: [cards]
scenes:
  - id: meet
    say: This tiny machine has one card and one box. Press Continue when you are ready.
    show: [cards, boxes]

  - id: press-step
    say: Press Step to make the machine do what the card says.
    show: [cards, boxes]
    spotlight: "button:step"
    until:
      - the machine has taken at least 1 step
    hints:
      - Do you see the Step button under the card?
      - A card is an instruction, and Step makes the machine follow it.
      - Click Step once. The box will change.
    showMe: demo-step
    doneSay: "There it is: the box holds 5."
    lock: [edit, drag, toggle]

  - id: did-it
    say: It did what the card said, and the box shows 5. Press Continue.
    show: [cards, boxes]
    spotlight: "box:a0"

  - id: names
    say: The small letters on the box, a0, are just its name. Press Continue to finish.
    show: [cards, boxes]
    spotlight: "box:a0"
nowYouCan:
  - Make the machine follow a card.
  - See what a box shows.
warmups:
  - id: one-card
    concept: cards
    question: The card says put 5 in the box. After you press Step, what does the box show?
    program:
      asm: |
        addi a0, zero, 5
    target: a0
    expected: 5
