id: c1/01-press-the-button
title: Your First Instruction
minutes: 3
concepts:
  introduces: [cards]
  requires: []
# One new idea (a card tells the machine what to do), one action (press Step), one card.
# The machine starts small: one box, no pointing arrow, no hex. Cannot be failed.
boxes: [a0]
pointer: false
hideEnd: true
starter:
  hex: ["0x00500513"]   # put 5 in box a0
tabs: [cards]
# The first lesson shows only what its one idea needs: a card, a box and one button. Back, Reset, the log,
# the end marker and the box's register name arrive in later lessons, when they matter.
ui:
  controls: [step]
  stepLabel: Run
  log: false
  deskTitle: false
  endMarker: false
  boxNames: false
  spotlight: ring
scenes:
  - id: meet
    say: A computer does exactly what each instruction says, one at a time. Select Continue.
    show: [cards, boxes]
    lock: [step, edit, drag, toggle]

  - id: the-card
    say: "This card is one instruction. It says: put 5 in the box."
    show: [cards, boxes]
    spotlight: "card:0"
    lock: [step, edit, drag, toggle]

  - id: the-box
    say: This is the box. Right now it is empty.
    show: [cards, boxes]
    spotlight: "box:a0"
    lock: [step, edit, drag, toggle]

  - id: press-step
    say: Select Run. The computer follows the instruction.
    show: [cards, boxes]
    spotlight: "button:step"
    until:
      - the machine has taken at least 1 step
    hints:
      - Find the blue Run button above the card.
      - The card is an instruction. The Run button makes the computer follow it.
      - Select Run one time. Then look at the box.
    showMe: demo-step
    doneSay: The box now holds 5.
    lock: [edit, drag, toggle]

  - id: did-it
    say: The computer did what the card says. It put 5 in the box.
    show: [cards, boxes]
    spotlight: "box:a0"
    lock: [step, edit, drag, toggle]

  - id: big-idea
    say: A program is a list of instructions that the computer follows. This program has only one instruction.
    show: [cards, boxes]
    lock: [step, edit, drag, toggle]
nowYouCan:
  - Make a computer follow an instruction.
  - See what an instruction does to a box.
warmups:
  - id: one-card
    concept: cards
    question: "The card says: put 5 in the box. After you select Run, what does the box show?"
    program:
      asm: |
        addi a0, zero, 5
    target: a0
    expected: 5

