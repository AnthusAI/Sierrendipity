id: c1/03-last-one-wins
title: Last One Wins
minutes: 3
concepts:
  introduces: [last-wins]
  requires: [cards, numbers-on-cards]
# One new idea (a later card replaces what an earlier one put in the box), one action (predict, then watch).
boxes: [a0]
pointer: false
hideEnd: true
starter:
  hex: ["0x00300513", "0x00800513"]   # put 3 in box a0, then put 8 in box a0
tabs: [cards]
ui:
  controls: [step, reset]
  stepLabel: Run
  resetLabel: Start again
  log: false
  deskTitle: false
  endMarker: false
  boxNames: false
  glass: true
  spotlight: ring
onWrongDefault:
  say: Watch the box.
  goto: watch
scenes:
  - id: predict
    glassNamed: true
    say: Two cards put a number in the same box, one after the other. What does the box hold at the end?
    show: [cards, boxes]
    spotlight: "box:a0"
    ask:
      kind: number
      question: What does the box hold after both cards?
      target: a0
      answer: 8
    hints:
      - Which card does the machine follow last?
      - Each card puts its number in the same box. The new number replaces the old number.
      - The last card puts 8 in the box.
    lock: [edit, drag, toggle]

  - id: watch
    say: Select Run two times. Look at the box.
    show: [cards, boxes]
    spotlight: "button:step"
    until:
      - the machine has taken at least 2 steps
      - the box shows 8
    hints:
      - Which button follows the next card?
      - Each selection follows one card. The second card comes after the first card.
      - After two selections, the box shows 8.
    showMe: demo-step-twice
    doneSay: Both cards ran, and the box ends with 8. The second number replaced the first, so the last card wins.
    lock: [edit, drag, toggle]
nowYouCan:
  - Guess what a list of cards will do.
  - Know that the last card to run wins.
warmups:
  - id: two-puts
    concept: last-wins
    question: "The cards say: put 2 in the box. Then put 9 in the box. What does the box show at the end?"
    program:
      asm: |
        addi a0, zero, 2
        addi a0, zero, 9
    target: a0
    expected: 9
