id: c1/02-change-one-number
title: Change One Number
minutes: 5
concepts:
  introduces: [numbers-on-cards]
  requires: [cards, boxes]
# Skeleton: last lesson's list. Spin the number on a card until box a2 holds 42.
starter:
  hex: ["0x00500513", "0x00700593", "0x00b50633", "0x00100073"]
tabs: [cards, boxes]
scenes:
  - id: look
    say: This is last lesson's list. Today you change a number on one card.
    show: [cards, boxes, D1]

  - id: change
    say: Spin the number on the first card until box a2 holds 42.
    show: [cards, boxes, D1]
    spotlight: "card:0"
    until:
      - the student edited a card
      - the machine halted normally
      - box a2 holds 42
    hints:
      - The first card has a number you can spin.
      - Box a2 holds the first number plus 7.
      - 35 plus 7 is 42.
    showMe: demo-spin
    lock: [drag, toggle]

  - id: done
    say: You changed what the machine does by changing one number.
    show: [cards, boxes]
nowYouCan:
  - Change the number on a card.
  - Work out which number makes a total.
warmups:
  - id: change-the-eight
    concept: numbers-on-cards
    question: Card one puts 8 in box a0 and card two puts 4 in box a1. What does box a2 hold after the add?
    program:
      asm: |
        addi a0, zero, 8
        addi a1, zero, 4
        add a2, a0, a1
        ebreak
    target: a2
    expected: 12
