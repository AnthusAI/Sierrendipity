id: x1/02-lamps
title: Stage fixture, lamps and bands
minutes: 5
draft: true
# A test fixture for the real stage (draft: never listed in the course): bit lamps with locked and allowed
# bits, the card flip, field bands with a click-target question, and the carry ripple.
concepts:
  introduces: [cards]
  requires: []
boxes: [a0, a1, a2]
pointer: false
hideEnd: true
starter:
  hex: ["0x00500513", "0x00700593", "0x00b50633"]   # put 5 in a0, put 7 in a1, add a0 and a1 into a2
tabs: [cards, lamps]
onWrongDefault:
  say: Look at the bands again.
  goto: bands
scenes:
  - id: lamps-word
    say: The lamps of the first card. Only lamps 20 and 21 can be switched.
    show: [D4]
    lamps: { card: 0, allowedBits: [20, 21, 22], lockedBits: [22] }
    showMe: demo-toggle

  - id: lamps-number
    say: Only the number of the first card, as place values.
    show: [D4]
    lamps: { card: 0, of: number, width: 6, target: 5 }

  - id: flip
    say: Flip the add card over.
    show: [D5]
    flip: { card: 2 }
    spotlight: flip

  - id: bands
    say: Which band names the box for the answer?
    show: [D8]
    bands: { card: 2, allowedBits: [30] }
    ask:
      kind: click-target
      question: Select the band that names the answer box.
      target: "band:rd"
    hints:
      - Read the labels on the bands.
      - One band says "answer goes in box".
      - Select the band that says "answer goes in box".
    onWrong:
      - match: "band:rs1"
        say: That band names the first box to read.
        goto: bands
    showMe: demo-click
    lock: [toggle]

  - id: carry
    say: Five plus seven, with the carry.
    show: [D7]
    carry: { a: 5, b: 7 }

  - id: last
    say: These are all of them.
    show: [D1]
nowYouCan:
  - Look at the lamps in many ways.
