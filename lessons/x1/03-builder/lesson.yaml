id: x1/03-builder
title: Stage fixture, the builder
minutes: 4
draft: true
# A test fixture for the real stage (draft: never listed in the course): typing into a spinner and
# dragging cards from a tray into the program, both by the student and by the Show me ghost.
concepts:
  introduces: [cards]
  requires: []
boxes: [a0]
pointer: false
hideEnd: true
starter:
  hex: ["0x00100513"]   # put 1 in box a0
tabs: [cards]
scenes:
  - id: spin
    say: Type a number on the card.
    show: [D1]
    showMe: demo-type

  - id: build
    say: Drag two cards from the tray into the program.
    show: [builder]
    tray: ["addi a0, zero, 5", "addi a0, a0, 1"]
    spotlight: tray
    until:
      - the program has 3 cards
    hints:
      - The cards you can use are in the tray.
      - Drag a card from the tray into the program.
      - Drag both tray cards into the program.
    showMe: demo-build
    doneSay: Three cards in the program.

  - id: last
    say: That is all of them.
    show: [D1]
nowYouCan:
  - Build a program from cards.
