<!doctype html>
<html lang="en" data-theme="cool">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Sierrendipity</title>
    <!-- theme-init:start -->
    <script>
      // Generated by web/scripts/generate-theme-css.ts (src/theme/initScript.ts). Do not edit by hand.
      // Applies the student's color theme and mode before first paint, so a reload never flashes the
      // wrong palette. The session's user (if known) decides whose settings apply; otherwise the last
      // appearance used in this browser does.
      (function () {
        var root = document.documentElement;
        var theme = "cool";
        var mode = "system";
        try {
          var user = sessionStorage.getItem("sierrendipity:user");
          var stored = JSON.parse(localStorage.getItem(user ? "sierrendipity:settings:" + user : "sierrendipity:settings:last") || "null");
          var found = (user ? stored && stored.appearance : stored) || {};
          if (["cool","warm","neutral"].indexOf(found.theme) >= 0) theme = found.theme;
          if (["light","dark","system"].indexOf(found.mode) >= 0) mode = found.mode;
        } catch (e) {
          /* damaged or unavailable storage: the defaults apply */
        }
        var dark = mode === "dark";
        if (mode === "system") {
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = false;
          }
        }
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-mode", dark ? "dark" : "light");
        root.classList.toggle("dark", dark);
      })();
    </script>
    <!-- theme-init:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
